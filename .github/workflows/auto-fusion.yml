# Publica solo el articulo semanal si nadie lo veta en 24 horas.
#
# Axcencorp abre cada lunes un PR desde una rama "articulo/<slug>" y avisa al dueño por
# Telegram. Para VETARLO basta con cerrar el PR (o ponerle la etiqueta "veto"). Si sigue
# abierto 24 h despues, este workflow lo fusiona y lanza el despliegue.
#
# Solo toca PRs cuya rama empieza por "articulo/" y que vienen de este mismo repo: cualquier
# otro PR (como los de mantenimiento) espera a que el dueño lo fusione a mano.
#
# Por que lanza deploy.yml a mano: una fusion hecha con GITHUB_TOKEN no dispara el evento
# "push" para otros workflows (GitHub lo evita a proposito), pero si permite workflow_dispatch.

name: Publicar articulo semanal sin veto

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, al minuto 17
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-fusion
  cancel-in-progress: false

jobs:
  fusionar:
    runs-on: ubuntu-latest
    steps:
      - name: Fusionar los articulos con mas de 24 h y sin veto
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          limite=$(date -u -d '24 hours ago' +%s)
          fusionados=0
          gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,headRefName,createdAt,isDraft,labels,isCrossRepository,title \
            --jq '.[] | select(.headRefName | startswith("articulo/"))
                       | select(.isDraft | not) | select(.isCrossRepository | not)
                       | select([.labels[].name] | index("veto") | not)
                       | "\(.number)\t\(.createdAt)\t\(.title)"' |
          while IFS=$'\t' read -r numero creado titulo; do
            if [ "$(date -u -d "$creado" +%s)" -le "$limite" ]; then
              echo "Fusionando #$numero: $titulo"
              gh pr merge "$numero" --repo "$REPO" --squash --delete-branch
              fusionados=$((fusionados + 1))
              echo "$fusionados" > /tmp/fusionados
            else
              echo "#$numero aun dentro de las 24 h de veto: $titulo"
            fi
          done
          if [ -s /tmp/fusionados ]; then
            gh workflow run deploy.yml --repo "$REPO" --ref main
          fi
